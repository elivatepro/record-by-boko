[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
credentials = "1.6.0"
googleId = "1.2.1"
playServicesAuth = "22.0.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
openapiGenerator = "7.26.0"
junit = "4.13.2"
coroutines = "1.11.0"
# Libraries the Plaud SDK aar uses but doesn't declare (see app/libs/README.md).
gson = "2.14.0"
javaWebsocket = "1.6.0"
bouncycastle = "1.86"
guava = "33.7.2-android"
conscrypt = "2.7.0"
# The SDK configures logback itself. Java-WebSocket 1.6 brings SLF4J 2, which needs logback-android 3.
logbackAndroid = "3.0.0"
slf4j = "2.0.20"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Only needed so the generated ApiClient.kt compiles; Roudio builds its own Retrofit (no body logging).
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
plaud-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
plaud-retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
plaud-java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
plaud-bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
plaud-conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
plaud-guava = { module = "com.google.guava:guava", version.ref = "guava" }
plaud-logback-android = { module = "com.github.tony19:logback-android", version.ref = "logbackAndroid" }
plaud-slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }

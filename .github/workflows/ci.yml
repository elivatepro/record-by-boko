name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roudio
          POSTGRES_PASSWORD: roudio
          POSTGRES_DB: roudio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roudio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://roudio:roudio@localhost:5432/roudio_test
      DATABASE_URL: postgresql+psycopg://roudio:roudio@localhost:5432/roudio_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # The pipeline decodes audio with ffmpeg (pipeline tests use synthetic tones).
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
        working-directory: .
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
      - name: OpenAPI description is up to date
        run: |
          uv run roudio-openapi
          git diff --exit-code -- ../../packages/api-spec/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Design tokens are up to date
        run: pnpm tokens:check
      - name: API types are up to date
        run: |
          pnpm --filter @roudio/web api:types
          git diff --exit-code -- apps/web/src/api/schema.d.ts
      - run: pnpm --filter @roudio/web lint
      - run: pnpm --filter @roudio/web build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

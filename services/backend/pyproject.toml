[project]
name = "roudio-backend"
version = "0.1.0"
description = "Roudio backend: FastAPI api and job worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "google-auth>=2.36",
    "requests>=2.32",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "cryptography>=44",
    "boto3>=1.40",
    "numpy>=2.0",
    "fireredvad>=0.0.2",
    "torch>=2.6",
]

[project.scripts]
roudio-api = "roudio.cli:api"
roudio-worker = "roudio.cli:worker"
roudio-openapi = "roudio.cli:openapi"
roudio-reprocess = "roudio.cli:reprocess"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "boto3-stubs[s3]>=1.43.111",
    "moto[s3]>=5",
]

[tool.uv.sources]
# CPU-only PyTorch on Linux (Railway); the default build elsewhere (macOS for development).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roudio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607", "ASYNC240"]
"migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "fireredvad.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
